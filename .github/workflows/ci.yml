# ビルドと単体テストを自動で回す。
#
# WPF プロジェクト（Kado.App / AppBarProbe）は net8.0-windows だが、
# Directory.Build.props で EnableWindowsTargeting を立てているため Linux でもビルドできる。
# 実行は Windows が必要なので、ここで確認するのはコンパイルが通ることまで。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手動でも流せるようにしておく
  workflow_dispatch:

# 同じブランチで新しい実行が始まったら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ビルドとテスト
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリの取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: .NET 8 SDK のセットアップ
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: NuGet パッケージのキャッシュ
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 依存関係の復元
        run: dotnet restore

      - name: ビルド
        run: dotnet build --no-restore --configuration Release

      - name: テスト
        # 実働日の実ファイル（実働日ファイル.xlsx）や旧バックアップを使う統合テストを含む。
        #
        # LogFileName で名前を固定すると、テストプロジェクトごとに同じファイルへ書き込んで
        # 最後の1つしか残らない。LogFilePrefix ならプロジェクト名とフレームワークが
        # 名前に入るので、全プロジェクトの結果がそろう。
        run: >
          dotnet test --no-build --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=test-results"
          --results-directory TestResults

      - name: テスト結果の保存
        # 失敗したときこそ中身を見たいので、結果に関わらず必ず上げる
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 14
